name: Terraform PR

# Cloud plan runs only for trusted same-repository pull requests.

on:
  pull_request:
    paths:
      - "**/*.tf"
      - "**/*.tftpl"
      - ".github/workflows/terraform-*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  cloud-plan:
    if: >-
      vars.GCP_ENVIRONMENT_ACTIVE == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
      TF_VAR_apply_service_account_email: ${{ secrets.GCP_APPLY_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - name: Debug OIDC subject and audience only
        shell: bash
        run: |
          response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://iam.googleapis.com/${{ secrets.GCP_WIF_PROVIDER }}")"
          jwt="$(jq -r '.value' <<<"${response}")"
          payload="$(cut -d. -f2 <<<"${jwt}")"
          payload="${payload//-/+}"
          payload="${payload//_/\/}"
          case $((${#payload} % 4)) in
            2) payload="${payload}==" ;;
            3) payload="${payload}=" ;;
          esac
          claims="$(printf '%s' "${payload}" | base64 --decode)"
          jq -r '"sub=" + .sub, "aud=" + (if (.aud | type) == "array" then (.aud | join(",")) else .aud end)' <<<"${claims}"
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_PR_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Initialize GCS backend
        run: >-
          terraform init -input=false
          -backend-config="bucket=${{ secrets.GCP_TF_STATE_BUCKET }}"
          -backend-config="prefix=terraform/root"
      - name: Plan without acquiring a write lock
        shell: bash
        run: |
          set +e
          terraform plan -lock=false -no-color -out=tfplan >plan.log 2>&1
          status=$?
          set -e
          grep -E '^(Plan:|No changes\.)' plan.log || true
          if [ "$status" -ne 0 ]; then
            sed -e "s/${TF_VAR_project_id}/<PROJECT_ID>/g" plan.log | tail -80
            exit "$status"
          fi
